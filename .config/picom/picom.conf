#################################
# SHADOWS (minimal cost)
#################################

shadow = true;
shadow-radius = 4;
shadow-offset-x = -3;
shadow-offset-y = -3;
shadow-opacity = 0.45;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g = 'slop'",
  "class_g = 'obs'",
  "class_g ?= 'Notify-osd'",
  "_GTK_FRAME_EXTENTS@:c",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
# ANIMATIONS (OFF — keep it OFF)
#################################

animations = false;

#################################
# FADING (DISABLE — faster focus)
#################################

fading = false;

#################################
# OPACITY (very light, no stacking)
#################################

inactive-opacity = 0.98;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "92:class_g = 'TelegramDesktop'"
];

#################################
# ROUNDED CORNERS (OFF)
#################################

corner-radius = 0;

#################################
# BLUR (OFF — huge cost)
#################################

blur-background = false;

#################################
# BACKEND (FASTEST + STABLE)
#################################

backend = "xrender";
vsync = false;

#################################
# PERFORMANCE FLAGS
#################################

use-damage = true;
unredir-if-possible = true;
unredir-if-possible-delay = 0;

detect-client-opacity = true;
detect-transient = true;
detect-rounded-corners = false;

mark-wmwin-focused = true;
mark-ovredir-focused = true;

#################################
# MISC
#################################

log-level = "warn";

#################################
# WINDOW TYPES
#################################

wintypes:
{
  tooltip = { fade = false; shadow = true; opacity = 0.85; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
};
